name: 광고 리포트 갱신

on:
  # 목/월 오전 09:00 KST = 00:00 UTC. GitHub 기본 cron은 활동이 뜸한 저장소에서
  # 며칠씩 안 도는 경우가 있었다(morningpick 사례) — 안 돌면 workflow_dispatch로
  # 수동 실행하거나, morningpick처럼 외부 크론으로 이 workflow_dispatch를
  # 직접 두드리는 방식으로 바꾼다.
  schedule:
    - cron: "0 0 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 리포트 생성
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          PYTHONIOENCODING: utf-8
          TZ: Asia/Seoul
        run: python src/report.py
      - name: docs/ 커밋
        run: |
          git config user.name  "ad-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "report: 자동 갱신 $(date +%Y-%m-%d)"
          git push || true

  deploy-pages:
    needs: update-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
